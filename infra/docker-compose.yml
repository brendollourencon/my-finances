# Ambiente de desenvolvimento local.
# Sobe apenas a infraestrutura: docker compose --env-file .env -f infra/docker-compose.yml up -d --wait
# As apps (api/web) rodam no host (ex.: WebStorm ou `pnpm dev`) com watch/hot reload.
name: my-finances

services:
  mariadb:
    image: mariadb:10.11 # LTS; suporta triggers e particionamento
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
      # Executados apenas na primeira inicialização do volume
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mariadb_data:
